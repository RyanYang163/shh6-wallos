version: "3.8"

services:
  shh6-wallos:
    image: bellamy/wallos:5.7.1
    container_name: shh6-wallos
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    ports:
      - "18806:80"
    user: "1000:1000"
    volumes:
      - /Volume*/DockerAppData/shh6-wallos/data:/var/www/html/db
    environment:
      - TZ=Asia/Shanghai
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "300m"
          memory: 256M

x-app-meta:
  web:
    port: 18806
    protocol: http
