#
# Least privilege: no privileged mode, no host network, capabilities reduced
# to an explicit allow-list. See README.md §权限与最小化 and PRIVACY.md §4.
# ============================================================================
services:
  shh6-wallos:
    image: bellamy/wallos:5.8.1
    container_name: shh6-wallos
    restart: unless-stopped
    ports:
      - "18806:80"
    volumes:
      - /Volume*/DockerAppData/shh6-wallos/data:/var/www/html/db
      - /Volume*/DockerAppData/shh6-wallos/logos:/var/www/html/images/uploads/logos
    environment:
      - TZ=Asia/Shanghai
      # The image's startup.sh rewrites the internal www-data account to this
      # UID/GID, so the PHP processes run as uid 1000 rather than root.
      - PUID=1000
      - PGID=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Allow-list: Docker's default set minus NET_RAW / SETPCAP / SETFCAP,
      # none of which this application needs.
      - AUDIT_WRITE
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - FSETID
      - KILL
      - MKNOD
      - NET_BIND_SERVICE
      - SETGID
      - SETUID
      - SYS_CHROOT
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 256M

x-app-meta:
  web:
    port: 18806
    protocol: http
